name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Setup Notion CLI
        uses: andrewkrippner/setup-ntn@1.0.0
        with:
          notion_api_token: ${{ secrets.NOTION_API_TOKEN }}
          notion_workspace_id: ${{ secrets.NOTION_WORKSPACE_ID }}

      - name: Configure worker env
        run: |
          ntn workers env set CHESSCOM_USERNAME=${{ vars.CHESSCOM_USERNAME }}
          ntn workers env set TIMEZONE=${{ vars.TIMEZONE }}

      - name: Deploy worker
        run: ntn workers deploy
