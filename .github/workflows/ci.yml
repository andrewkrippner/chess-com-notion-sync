name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  # setup-ntn@1.0.0 still declares runs.using: node20. Opt the workflow into
  # Node 24 so the deprecation warning clears ahead of the June 2026 cutoff.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Setup Notion CLI
        uses: andrewkrippner/setup-ntn@1.0.0
        with:
          notion_api_token: ${{ secrets.NOTION_API_TOKEN }}

      - name: Check workers.json is committed
        run: |
          if [ ! -f workers.json ]; then
            echo "::error::workers.json is missing. This is a one-time local bootstrap step."
            echo "::error::See README → 'First-time setup' for instructions."
            exit 1
          fi

      - name: Configure worker env
        run: |
          ntn workers env set CHESSCOM_USERNAME=${{ vars.CHESSCOM_USERNAME }}
          ntn workers env set TIMEZONE=${{ vars.TIMEZONE }}

      - name: Deploy worker
        env:
          SYNC_SCHEDULE: ${{ vars.SYNC_SCHEDULE }}
        run: ntn workers deploy
